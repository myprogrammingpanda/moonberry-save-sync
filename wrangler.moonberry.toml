# The ORIGINAL Moonberry group's coordinator -- deploy it from this folder with
#   npx wrangler deploy --config wrangler.moonberry.toml
# Same Worker as coordinator/wrangler.toml plus the HOST_KV copy that older
# setups have. Kept out of coordinator/ so the Deploy button doesn't copy it
# to new groups. Keep `name`, the Durable Object and [[migrations]] in step
# with coordinator/wrangler.toml: the stored data belongs to this name + class.

name = "moonberry-coordinator"
main = "coordinator/worker.js"
compatibility_date = "2026-09-04"

[[kv_namespaces]]
binding = "HOST_KV"
id = "3e725a4e4a6e48e8be239b5c8e473693"

# All coordinator state lives in one SQLite-backed Durable Object (the only
# kind available on the Workers Free plan); HOST_KV above just keeps a copy.
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]
